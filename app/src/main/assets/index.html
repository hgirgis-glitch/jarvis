<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<style>
  :root { --c: #2fe6ff; --c2: #ff9a2f; --dim: rgba(47, 230, 255, .55); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Rajdhani", "Roboto Condensed", system-ui, sans-serif; color: var(--c); }
  canvas { position: fixed; inset: 0; display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
    justify-content: space-between; padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; font-size: 12px;
    letter-spacing: .25em; text-transform: uppercase; color: var(--dim); }
  .brand { font-size: 22px; letter-spacing: .5em; color: var(--c); text-shadow: 0 0 12px var(--c); }
  .right { text-align: right; line-height: 1.7; }
  .state { margin-top: 6px; color: var(--c); }
  .bottom { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .line { max-width: 720px; width: 100%; text-align: center; min-height: 1.4em; }
  #user { font-size: 15px; color: #cfefff; opacity: .8; }
  #reply { font-size: 19px; line-height: 1.45; color: #e9fbff; text-shadow: 0 0 10px rgba(47,230,255,.35);
    max-height: 32vh; overflow: auto; pointer-events: auto; }
  #status, #sources { font-size: 12px; letter-spacing: .12em; color: var(--dim); }
  .bar { display: flex; gap: 10px; width: 100%; max-width: 720px; pointer-events: auto; }
  .bar input { flex: 1; min-width: 0; background: rgba(0, 20, 30, .6); border: 1px solid rgba(47,230,255,.35);
    color: #e9fbff; padding: 12px 14px; border-radius: 4px; font: inherit; font-size: 16px; outline: none; }
  .bar input:focus { border-color: var(--c); box-shadow: 0 0 12px rgba(47,230,255,.3); }
  .btn { background: rgba(0, 20, 30, .6); border: 1px solid rgba(47,230,255,.35); color: var(--c);
    padding: 0 14px; border-radius: 4px; font: inherit; font-size: 13px; letter-spacing: .15em; text-transform: uppercase; }
  .btn:active { background: rgba(47,230,255,.2); }
  #vaultBtn { pointer-events: auto; margin-top: 6px; }
  .tap { position: fixed; left: 50%; top: 46%; width: 56vmin; height: 56vmin; transform: translate(-50%, -50%);
    border-radius: 50%; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tap" id="tap" aria-label="Sprechen"></div>
<div class="hud">
  <div class="top">
    <div>
      <div class="brand">J.A.R.V.I.S.</div>
      <div id="clock"></div>
    </div>
    <div class="right">
      <div>Kern: Nano</div>
      <div>Vault: <span id="vault">nicht verbunden</span></div>
      <div class="state" id="state">Bereitschaft</div>
      <button class="btn" id="vaultBtn">Vault wählen</button>
    </div>
  </div>
  <div class="bottom">
    <div class="line" id="user"></div>
    <div class="line" id="reply"></div>
    <div class="line" id="sources"></div>
    <div class="line" id="status">Initialisiere Systeme</div>
    <form class="bar" id="form">
      <button class="btn" type="button" id="mic">Sprechen</button>
      <input id="input" placeholder="Schreiben statt sprechen" autocomplete="off">
      <button class="btn" type="submit">Senden</button>
    </form>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const native = window.Android || { listen() {}, ask() {}, stop() {}, pickVault() {} };
  const STATE_LABEL = { idle: "Bereitschaft", listening: "Höre zu", thinking: "Denke nach", speaking: "Spreche" };
  const STATE_COLOR = { idle: 0x2fe6ff, listening: 0x5cffc8, thinking: 0xff9a2f, speaking: 0x2fe6ff };

  let state = "idle", level = 0, targetLevel = 0, pulse = 0;

  // ---------- scene ----------
  const canvas = $("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.06);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.set(0, 0, 7);

  const noise = `
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
      i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }`;

  const uniforms = { uTime: { value: 0 }, uLevel: { value: 0 }, uColor: { value: new THREE.Color(0x2fe6ff) } };

  // Core: displaced wireframe sphere
  const coreMat = new THREE.ShaderMaterial({
    uniforms, wireframe: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: noise + `
      uniform float uTime; uniform float uLevel; varying float vN;
      void main(){
        float n = snoise(normal*1.6 + uTime*0.35);
        vN = n;
        vec3 p = position + normal*(n*(0.12 + uLevel*0.55));
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uLevel; varying float vN;
      void main(){ gl_FragColor = vec4(uColor*(0.55 + vN*0.5 + uLevel*0.6), 0.55 + uLevel*0.3); }`
  });
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 5), coreMat);
  scene.add(core);

  // Inner glow
  const glowMat = new THREE.ShaderMaterial({
    uniforms, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: `varying vec3 vNormal; void main(){ vNormal = normalize(normalMatrix*normal);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 uColor; uniform float uLevel; varying vec3 vNormal;
      void main(){ float i = pow(max(0.0, 1.0 + dot(vNormal, vec3(0.0,0.0,1.0))), 4.0);
        gl_FragColor = vec4(uColor, 1.0)*i*(0.55 + uLevel*0.8); }`
  });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(1.9, 48, 48), glowMat);
  glow.material.side = THREE.BackSide;
  scene.add(glow);

  // Rings
  const rings = [];
  function ring(r, w, tiltX, tiltY, segments, dash) {
    const g = new THREE.RingGeometry(r, r + w, segments, 1, 0, dash || Math.PI * 2);
    const m = new THREE.MeshBasicMaterial({ color: 0x2fe6ff, transparent: true, opacity: 0.55,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
    const mesh = new THREE.Mesh(g, m);
    mesh.rotation.set(tiltX, tiltY, 0);
    scene.add(mesh); rings.push(mesh); return mesh;
  }
  ring(2.05, 0.015, 1.2, 0.2, 128);
  ring(2.25, 0.05, 1.2, 0.2, 128, Math.PI * 1.3);
  ring(2.6, 0.012, 0.4, -0.6, 128);
  ring(2.75, 0.03, 0.4, -0.6, 64, Math.PI * 0.6);
  ring(3.1, 0.008, -0.9, 0.9, 128);

  // Tick marks around the core (arc reactor feel)
  const ticks = new THREE.Group();
  for (let i = 0; i < 72; i++) {
    const long = i % 6 === 0;
    const t = new THREE.Mesh(new THREE.PlaneGeometry(long ? 0.03 : 0.012, long ? 0.22 : 0.1),
      new THREE.MeshBasicMaterial({ color: 0x2fe6ff, transparent: true, opacity: long ? 0.8 : 0.4,
        blending: THREE.AdditiveBlending, depthWrite: false }));
    const a = (i / 72) * Math.PI * 2;
    t.position.set(Math.cos(a) * 2.45, Math.sin(a) * 2.45, 0);
    t.rotation.z = a + Math.PI / 2;
    ticks.add(t);
  }
  scene.add(ticks);

  // Particles
  const N = 1400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 3 + Math.random() * 9, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th); pos[i * 3 + 2] = r * Math.cos(ph);
  }
  const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const particles = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x2fe6ff, size: 0.03, transparent: true,
    opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(particles);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // keep the orb fully visible on the narrow cover screen and the wide inner screen
    camera.position.z = Math.max(7, 5.6 / Math.max(w / h, 0.4));
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  const color = new THREE.Color(0x2fe6ff), targetColor = new THREE.Color(0x2fe6ff);
  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (state === "speaking") targetLevel = Math.max(targetLevel * 0.9, 0.25 + 0.2 * Math.sin(t * 9) * Math.sin(t * 3.7));
    if (state === "thinking") targetLevel = 0.18 + 0.12 * Math.sin(t * 5);
    if (state === "idle") targetLevel = 0.04 + 0.03 * Math.sin(t * 1.3);
    pulse *= 0.88;
    level += ((targetLevel + pulse) - level) * Math.min(1, dt * 10);
    uniforms.uTime.value = t;
    uniforms.uLevel.value = level;
    color.lerp(targetColor, dt * 3);
    uniforms.uColor.value.copy(color);
    rings.forEach((r, i) => { r.material.color.copy(color); r.rotation.z += dt * (0.12 + i * 0.05) * (i % 2 ? -1 : 1) * (1 + level * 4); });
    ticks.children.forEach(m => m.material.color.copy(color));
    ticks.rotation.z -= dt * (0.05 + level * 0.6);
    particles.material.color.copy(color);
    core.rotation.y += dt * 0.15; core.rotation.x += dt * 0.05;
    particles.rotation.y += dt * 0.02;
    const s = 1 + level * 0.12; core.scale.set(s, s, s);
    camera.position.x = Math.sin(t * 0.2) * 0.3; camera.position.y = Math.cos(t * 0.17) * 0.2; camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- HUD ----------
  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }) +
      "  " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  setInterval(tick, 1000); tick();

  window.jarvis = {
    on(kind, value) {
      if (kind === "state") {
        state = value;
        $("state").textContent = STATE_LABEL[value] || value;
        targetColor.set(STATE_COLOR[value] || 0x2fe6ff);
        if (value === "listening") { $("reply").textContent = ""; $("sources").textContent = ""; }
      } else if (kind === "vault") {
        $("vault").textContent = value;
        $("vaultBtn").textContent = "Vault ändern";
      } else if (kind === "sources") {
        $("sources").textContent = value ? "Quellen: " + value : "";
      } else if (kind === "user" || kind === "reply" || kind === "status") {
        $(kind).textContent = value;
      }
    },
    level(v) { targetLevel = Math.max(0, Math.min(1, v)) * 0.9; },
    pulse() { pulse = 0.35; }
  };

  $("tap").addEventListener("click", () => {
    if (state === "speaking" || state === "listening") native.stop(); else native.listen();
  });
  $("mic").addEventListener("click", () => { $("status").textContent = "Mikrofon wird gestartet"; native.listen(); });
  $("vaultBtn").addEventListener("click", () => native.pickVault());
  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("input").value.trim();
    if (!v) return;
    $("input").value = ""; $("input").blur();
    native.ask(v);
  });
})();
</script>
</body>
</html>
