name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk

      - name: Als Release "latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jarvis.apk \
            --title "JARVIS Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Handy herunterladen und installieren."
